# Package-owned runtime checkpoint record.
#
# sha256 was pinned 2026-09-14 by cross-verifying two independent sources of
# the same Hugging Face-hosted file: the Hub API's own reported LFS object
# hash (a git-lfs oid, which is a sha256 by spec) and an independent full
# download hashed locally -- both produced the identical digest below. The
# upstream repo (erl-j/ddsp-guitar-unified) has a single commit; `revision`
# pins that exact commit rather than the mutable `main` branch ref, so this
# record continues to describe the artifact even if new commits are pushed.
#
# license = "NOASSERTION" (verified 2026-09-14, primary sources -- see
# CLAUDE.md's "Weights license" section for the full evidence chain): the
# checkpoint's own HF hosting record (erl-j/ddsp-guitar-unified) states
# `license: unknown` and carries no model card. The author's companion code
# repo (github.com/erl-j/ddsp-guitar, `gh api repos/erl-j/ddsp-guitar --jq
# .license` -> apache-2.0) is the official demo code for the paper this
# checkpoint comes from (Jonason et al., "DDSP-based Neural Waveform
# Synthesis of Polyphonic Guitar Performance from String-wise MIDI Input",
# arXiv:2309.07658) and its own render_midi.py downloads this exact file
# from this exact HF URL as "the unified model" -- strong circumstantial
# linkage, but Apache-2.0 licenses that GitHub repo's *code*, and the HF
# model repo (the authoritative record for this specific artifact) states
# no license of its own for the trained weights. No party in the chain
# grants an explicit license for the checkpoint itself.
