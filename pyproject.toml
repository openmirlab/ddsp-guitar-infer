[project]
name = "ddsp-guitar-infer"
version = "0.1.0"
description = "Inference-only PyTorch pipeline for DDSP-based guitar synthesis"
readme = "README.md"
authors = [
    { name = "Paul", email = "bernie40916@gmail.com" }
]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "einops>=0.8.0",
    "pretty_midi>=0.2.10",
    "soundfile>=0.12.1",
    "tqdm>=4.67.1",
    "huggingface_hub>=0.24.0",
    "numpy>=1.24,<3.0",
    "julius>=0.2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/openmirlab/ddsp-guitar-infer"
Repository = "https://github.com/openmirlab/ddsp-guitar-infer"
Changelog = "https://github.com/openmirlab/ddsp-guitar-infer/blob/main/CHANGELOG.md"

[project.scripts]
ddsp-guitar-infer = "ddsp_guitar_infer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
