name: Release verification

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install '3.10'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run test suite
        run: uv run pytest -q

  build:
    needs: [test]
    runs-on: ubuntu-latest
    # Note: Environment is optional. If you want to add protection rules later,
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*
