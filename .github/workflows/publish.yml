name: Publish to PyPI

# Publishes to PyPI when a GitHub Release is created. Uses PyPI's trusted
# publishing feature (must be configured on PyPI for the openmirlab org /
# ddsp-guitar-infer repo). Per the org's test-gating convention, `publish`
# depends on `test` passing first -- nothing reaches PyPI without the suite
# green.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install '3.10'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run test suite
        run: uv run pytest -q

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    # Note: Environment is optional. If you want to add protection rules later,
    # create an environment named "pypi" in repository settings -> Environments
    permissions:
      id-token: write  # Required for trusted publishing (OIDC)
      contents: read    # Required to checkout code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
