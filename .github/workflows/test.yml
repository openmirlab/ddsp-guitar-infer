name: Test

# Runs the unit test suite (fast, no checkpoint download) on every push and
# pull request. The end-to-end synthesis regression (tests/test_e2e_regression.py)
# needs the ~360 MB erl-j/ddsp-guitar-unified checkpoint and self-skips unless
# DDSP_GUITAR_RUN_E2E=1 is set -- CI intentionally leaves it unset, so those
# tests report as skipped rather than downloading weights or hitting the network.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (dev extra; CPU-only torch)
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q
